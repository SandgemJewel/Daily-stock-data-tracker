name: schedule script

on:
  workflow_dispatch:
  schedule:
    - cron: "39 22 * * *"

permissions:
  contents: write

jobs:
  runCode:
    runs-on: ubuntu-latest
    steps:
      - name: Copy Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance

      - name: Run Code
        run:
          python main.py

      - name: Commit and push the excel
        run:
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.csv *.xlsx
          git commit -m "daily stock data update" || exit 0
          git push

